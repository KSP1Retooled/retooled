name: Mirror release to Gitee

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror (defaults to the latest release)
        required: false
  # Prototype only: lets the workflow run from a non-default branch.
  # Remove before merging to main.
  push:
    branches: [gitee-mirror]

concurrency:
  group: gitee-mirror-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITEE_OWNER: ksp1retooled
  GITEE_REPO: retooled

jobs:
  mirror:
    # Self-hosted: GitHub-hosted runners only reach Gitee at ~20 KB/s.
    runs-on: self-hosted
    container:
      image: ghcr.io/ksp1retooled/ksp-ci:1
      options: --user 1003:1003
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "Mirroring release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Mirror release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEEPAT }}
          TAG: ${{ steps.tag.outputs.tag }}
          # Assets are often uploaded after the release is published, so on
          # release events wait for the asset list to settle before syncing.
          WAIT_FOR_ASSETS: ${{ github.event_name == 'release' && github.event.action == 'published' }}
          # Prototype only: upload a single large asset to measure throughput.
          ASSET_FILTER: ${{ github.event_name == 'push' && '^retooled-linux\.rtpatch$' || '' }}
        run: .github/scripts/gitee-mirror.sh
